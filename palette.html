<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial scale=1">
  <title>Personal Site Palette</title>
  <style>
    body {
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .color {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
   
    <!--eye order-->
    <div class="color" style="background:#2e2b1e">#2e2b1e</div>
    <div class="color" style="background:#516673">#516673</div>
    <div class="color" style="background:#b29883">#b29883</div>
    <div class="color" style="background:#564025">#564025</div>
    <div class="color" style="background:#414537">#414537</div>
    <div class="color" style="background:#524c49">#524c49</div>
    <div class="color" style="background:#54503f">#54503f</div>
    <div class="color" style="background:#4e4632">#4e4632</div>
    <div class="color" style="background:#493a29">#493a29</div>
    <div class="color" style="background:#423e2b">#423e2b</div>

    <div class="color" style="background:#433830">#433830</div>
    <div class="color" style="background:#402e25">#402e25</div>
    <div class="color" style="background:#2e201a">#2e201a</div>

    

</body>
</html>
